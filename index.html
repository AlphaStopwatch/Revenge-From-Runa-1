<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RUNA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Cellipse cx='50' cy='50' rx='38' ry='20' fill='none' stroke='%23a3121f' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23a3121f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="atmosphere" aria-hidden="true">
  <div class="glow glow-red"></div>
  <div class="glow glow-purple"></div>
  <canvas id="dust"></canvas>
</div>

<main class="stage">
  <h1 class="name">RUNA</h1>

  <div class="eye-wrap" aria-hidden="true">
    <svg class="eye" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="iris" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000"/>
          <stop offset="28%" stop-color="#1a0205"/>
          <stop offset="62%" stop-color="#7d0f1a"/>
          <stop offset="100%" stop-color="#2a0409"/>
        </radialGradient>
        <radialGradient id="sclera" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#1c1c20"/>
          <stop offset="100%" stop-color="#050506"/>
        </radialGradient>
        <clipPath id="lid"><path d="M12 60 Q120 -8 228 60 Q120 128 12 60Z"/></clipPath>
      </defs>
      <path d="M12 60 Q120 -8 228 60 Q120 128 12 60Z" fill="url(#sclera)"/>
      <g clip-path="url(#lid)">
        <g class="iris-move">
          <circle cx="120" cy="60" r="40" fill="url(#iris)"/>
          <g class="iris-lines" stroke="#c4202f" stroke-width=".6" opacity=".45">
            <line x1="120" y1="60" x2="120" y2="22"/><line x1="120" y1="60" x2="147" y2="33"/>
            <line x1="120" y1="60" x2="158" y2="60"/><line x1="120" y1="60" x2="147" y2="87"/>
            <line x1="120" y1="60" x2="120" y2="98"/><line x1="120" y1="60" x2="93" y2="87"/>
            <line x1="120" y1="60" x2="82" y2="60"/><line x1="120" y1="60" x2="93" y2="33"/>
          </g>
          <circle class="pupil" cx="120" cy="60" r="14" fill="#000"/>
          <circle cx="130" cy="50" r="3.2" fill="#fff" opacity=".55"/>
        </g>
        <path class="lid-shade" d="M12 60 Q120 -8 228 60 Q120 128 12 60Z" fill="none" stroke="#000" stroke-width="22" opacity=".55"/>
      </g>
      <path d="M12 60 Q120 -8 228 60 Q120 128 12 60Z" fill="none" stroke="#8c1320" stroke-width="1.4" opacity=".8"/>
    </svg>
  </div>

  <section class="clock" aria-label="Elapsed time since 7 November 2026, 12:53 AM, Dhaka">
    <div class="digits" id="digits" role="timer" aria-live="off">
      <span id="h">000000</span><i>:</i><span id="m">00</span><i>:</i><span id="s">00</span>
    </div>
    <div class="units" aria-hidden="true"><span>hours</span><span>minutes</span><span>seconds</span></div>
  </section>

  <p class="line" id="line" aria-live="polite"></p>

  <section class="breakdown" aria-label="Total elapsed">
    <h2>Total elapsed</h2>
    <dl>
      <div><dd id="b-y">0</dd><dt>years</dt></div>
      <div><dd id="b-mo">0</dd><dt>months</dt></div>
      <div><dd id="b-d">0</dd><dt>days</dt></div>
      <div><dd id="b-h">0</dd><dt>hours</dt></div>
      <div><dd id="b-mi">0</dd><dt>minutes</dt></div>
      <div><dd id="b-s">0</dd><dt>seconds</dt></div>
    </dl>
  </section>

  <section class="waiting">
    <h2>Waiting for a reply</h2>
    <p>“Her reply remains uncertain.”</p>
    <p>“Time continues.”</p>
    <p>“The video remains a memory.”</p>
  </section>

  <section class="video" id="videoSection" aria-label="Video">
    <div class="video-frame">
      <video id="video" controls playsinline preload="none" controlsList="nodownload"></video>
      <div class="video-empty" id="videoEmpty">
        <label class="pick">Choose a video from this device
          <input type="file" id="videoFile" accept="video/*" hidden>
        </label>
      </div>
    </div>
  </section>

  <button class="copy" id="copyBtn" type="button" aria-label="Copy private text" title="Copy">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="8" y="3" width="8" height="4" rx="1"/>
      <path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/>
    </svg>
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<!-- Private, git-ignored local file. Copy config.private.example.js to config.private.js. -->
<script src="config.private.js" onerror="void 0"></script>
<script src="script.js"></script>
</body>
</html>
