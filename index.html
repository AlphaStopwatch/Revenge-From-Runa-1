<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RUNA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='6' fill='none' stroke='%23b3122b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23b3122b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="stage">
  <h1 class="name">RUNA</h1>

  <div class="eye-wrap" aria-hidden="true">
    <svg class="eye" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="iris" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#050005"/>
          <stop offset=".34" stop-color="#050005"/>
          <stop offset=".38" stop-color="#7a0a1e"/>
          <stop offset=".7" stop-color="#3a0714"/>
          <stop offset="1" stop-color="#14030a"/>
        </radialGradient>
        <clipPath id="lid"><path d="M12 60 Q120 -14 228 60 Q120 134 12 60Z"/></clipPath>
      </defs>
      <path class="lid" d="M12 60 Q120 -14 228 60 Q120 134 12 60Z" fill="#050204" stroke="#6b0f22" stroke-width="1.5"/>
      <g clip-path="url(#lid)">
        <g class="iris-move">
          <circle cx="120" cy="60" r="38" fill="url(#iris)"/>
          <g class="fibers" stroke="#c4152f" stroke-opacity=".35" stroke-width=".6">
            <path d="M120 60L120 24M120 60L146 34M120 60L156 60M120 60L146 86M120 60L120 96M120 60L94 86M120 60L84 60M120 60L94 34"/>
          </g>
          <circle class="pupil" cx="120" cy="60" r="13" fill="#000"/>
          <circle cx="130" cy="50" r="3" fill="#fff" fill-opacity=".55"/>
        </g>
        <ellipse class="shade" cx="120" cy="0" rx="130" ry="40" fill="#000" fill-opacity=".55"/>
      </g>
    </svg>
  </div>

  <section class="clock" aria-label="Elapsed time since 7 November 2026, 12:53 AM, Bangladesh time">
    <div id="main" class="main" role="timer" aria-live="off">
      <span id="h">000000</span><i>:</i><span id="m">00</span><i>:</i><span id="s">00</span>
    </div>
    <div class="units" aria-hidden="true"><span>hours</span><span>minutes</span><span>seconds</span></div>
    <p id="line" class="line" aria-live="polite"></p>
  </section>

  <section class="breakdown" aria-label="Total elapsed">
    <h2>Total elapsed</h2>
    <dl>
      <div><dd id="b-y">0</dd><dt>years</dt></div>
      <div><dd id="b-mo">0</dd><dt>months</dt></div>
      <div><dd id="b-d">0</dd><dt>days</dt></div>
      <div><dd id="b-h">0</dd><dt>hours</dt></div>
      <div><dd id="b-mi">0</dd><dt>minutes</dt></div>
      <div><dd id="b-s">0</dd><dt>seconds</dt></div>
    </dl>
  </section>

  <section class="waiting" aria-label="Waiting for a reply">
    <h2>Waiting for a reply</h2>
    <p>Her reply remains uncertain.</p>
    <p>Time continues.</p>
    <p>The video remains a memory.</p>
  </section>

  <section class="video" id="videoSection" aria-label="Video">
    <div class="frame">
      <video id="vid" controls playsinline preload="none"></video>
      <label id="pick" class="pick" tabindex="0">Choose a video from this device
        <input id="file" type="file" accept="video/*" hidden>
      </label>
    </div>
  </section>

  <footer class="foot">
    <button id="copy" class="copy" type="button" aria-label="Copy private text" title="Copy">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></svg>
    </button>
    <span id="toast" class="toast" role="status" aria-live="polite"></span>
  </footer>
</main>

<!-- Optional, local-only, git-ignored. See config.private.example.js -->
<script src="config.private.js" onerror="void 0"></script>
<script src="script.js"></script>
</body>
</html>
